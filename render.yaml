services:
  - type: web
    name: event-backend
    runtime: java17
    plan: free
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -jar target/DB-eventService-0.0.1-SNAPSHOT.jar"
    envVars:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
      - key: DATABASE_USERNAME
        value: ${DATABASE_USERNAME}
      - key: DATABASE_PASSWORD
        value: ${DATABASE_PASSWORD}
      - key: EMAIL_USERNAME
        value: ${EMAIL_USERNAME}
      - key: EMAIL_PASSWORD
        value: ${EMAIL_PASSWORD}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: JWT_EXPIRATION_MS
        value: ${JWT_EXPIRATION_MS}
      - key: STRIPE_SECRET_KEY
        value: ${STRIPE_SECRET_KEY}
      - key: STRIPE_WEBHOOK_SECRET
        value: ${STRIPE_WEBHOOK_SECRET}
      - key: TWILIO_SID
        value: ${TWILIO_SID}
      - key: TWILIO_TOKEN
        value: ${TWILIO_TOKEN}
      - key: TWILIO_PHONE
        value: ${TWILIO_PHONE}
