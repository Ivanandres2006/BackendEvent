<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reset Your Password</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: 'Segoe UI', sans-serif; color: #1a1a1a;">
<div style="max-width: 480px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; padding: 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">

    <!-- Header -->
    <h2 style="font-weight: 600; margin-bottom: 12px;">Hey [[${name}]],</h2>

    <!-- Body -->
    <p style="font-size: 15px; line-height: 1.6;">
        We received a request to reset your password. Use the code below to proceed:
    </p>

    <div style="margin: 28px 0; text-align: center;">
      <span style="display: inline-block; background-color: #e0e0e0; color: #000000; font-size: 22px; font-weight: 600; padding: 14px 28px; border-radius: 8px; letter-spacing: 2px;">
        [[${code}]]
      </span>
    </div>

    <p style="font-size: 13px; color: #555;">
        This code is valid for 10 minutes. If you didn’t request this, feel free to ignore it.
    </p>

    <!-- Divider -->
    <hr style="border: none; border-top: 1px solid #ddd; margin: 40px 0 20px 0;" />

    <!-- Footer -->
    <div style="text-align: center; font-size: 12px; color: #888;">

        <!-- Follow Button -->
        <p style="margin-bottom: 16px;">
            <a href="https://www.instagram.com/wkndevent/?hl=es"
               style="display: inline-flex; align-items: center; background-color: #f2f2f2; padding: 8px 16px; border-radius: 24px; text-decoration: none; color: #333; font-weight: 500; font-size: 13px;">
                <svg xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 448 512" style="fill:#333; margin-right: 8px;">
                    <path d="M224 202.7c-29.3 0-53.2 23.9-53.2 53.2S194.7 309 224 309s53.2-23.9 53.2-53.2S253.3 202.7 224 202.7zm124.7-41c0 14.1-11.4 25.6-25.6 25.6s-25.6-11.4-25.6-25.6 11.4-25.6 25.6-25.6 25.6 11.5 25.6 25.6zM398.8 112c-3.5-22.6-22.5-40.5-45.2-44C312.7 64 224 64 224 64s-88.7 0-129.6 4c-22.7 3.5-41.7 21.4-45.2 44C44 153.3 44 256 44 256s0 102.7 5.2 144c3.5 22.6 22.5 40.5 45.2 44 40.9 4 129.6 4 129.6 4s88.7 0 129.6-4c22.7-3.5 41.7-21.4 45.2-44C404 358.7 404 256 404 256s0-102.7-5.2-144zM224 338c-45.3 0-82-36.7-82-82s36.7-82 82-82 82 36.7 82 82-36.7 82-82 82z"/>
                </svg>
                Follow us
            </a>
        </p>

        <!-- Website -->
        <p style="margin: 6px 0;">
            <a href="https://www.wkndevent.com/" style="color: #555; text-decoration: none;">www.wkndevent.com</a>
        </p>

        <!-- Copyright -->
        <p style="margin: 8px 0 0 0; color: #999;">© 2025 WKND</p>
    </div>

</div>
</body>
</html>
