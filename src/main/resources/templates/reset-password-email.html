<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="margin:0; padding:0; font-family: 'Segoe UI', sans-serif; background-color:#0a0a0a; color:#ffffff;">
<div style="max-width: 600px; margin: auto; background-color: #121212; border-radius: 12px; padding: 40px;">
    <h2 style="color: #00ff91;">Hi [[${name}]],</h2>
    <p style="font-size: 16px; line-height: 1.5;">
        We received a request to reset your password. Use the code below to proceed:
    </p>
    <div style="margin: 20px 0; text-align: center;">
      <span style="display: inline-block; background-color: #00ff91; color: #000; font-size: 24px; font-weight: bold; padding: 12px 24px; border-radius: 8px;">
        [[${code}]]
      </span>
    </div>
    <p style="font-size: 14px; color: #aaaaaa;">
        This code will expire in 10 minutes. If you didn't request a reset, you can safely ignore this email.
    </p>
    <p style="margin-top: 40px; font-size: 14px;">— DB Event Team</p>
</div>
</body>
</html>
