<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Your WKND Tickets</title>
    <meta name="color-scheme" content="light only">
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Segoe UI,Arial,sans-serif;color:#1a1a1a;">
<div style="max-width:480px;margin:40px auto;background:#ffffff;border-radius:12px;padding:36px;box-shadow:0 4px 20px rgba(0,0,0,.05);">

    <h2 style="font-weight:600;margin:0 0 12px 0;">Thanks for your purchase, [[${name}]] 🎉</h2>
    <p style="font-size:15px;line-height:1.6;color:#444;">
        Here are your tickets for <b th:text="${event.title}">Event</b>
    </p>

    <div th:each="ticket : ${tickets}" style="margin:28px 0;padding:20px;border:1px solid #eee;border-radius:10px;background:#fafafa;">
        <h3 style="margin:0 0 8px 0;font-size:16px;font-weight:600;color:#000;">
            Ticket #<span th:text="${ticket.id}">0</span>
        </h3>

        <p style="margin:6px 0;"><b>Event:</b> <span th:text="${event.title}">Title</span></p>
        <p style="margin:6px 0;"><b>Date:</b>
            <span th:text="${#temporals.format(event.dateTime, 'EEE, MMM d yyyy h:mm a')}">Fri, Sep 5 2025 11:50 PM</span>
        </p>
        <p style="margin:6px 0;"><b>Location:</b> <span th:text="${event.location}">Location</span></p>

        <div style="margin:15px 0;text-align:center;">
            <!-- Primary: inline CID image -->
            <img th:if="${ticket.qrCid} != null"
                 th:src="'cid:' + ${ticket.qrCid}"
                 alt="QR Code"
                 width="180"
                 style="display:inline-block;border:4px solid #ddd;border-radius:12px;" />

            <!-- Fallback: public URL (works even if inline fails) -->
            <img th:if="${ticket.qrCid} == null and ${ticket.qrUrl} != null"
                 th:src="${ticket.qrUrl}"
                 alt="QR Code (fallback)"
                 width="180"
                 style="display:inline-block;border:4px solid #ddd;border-radius:12px;" />

            <!-- Last fallback: tiny note -->
            <div th:if="${ticket.qrCid} == null and ${ticket.qrUrl} == null"
                 style="color:#c00;font-size:12px;">(QR unavailable)</div>
        </div>

        <div style="text-align:center;">
            <a th:href="@{'https://backendevent-etce.onrender.com/api/passes/ticket/' + ${ticket.id}}"
               style="display:inline-block;padding:12px 20px;background:#000;color:#fff;border-radius:8px;
                  text-decoration:none;font-weight:600;font-size:14px;">
                Add to Apple Wallet
            </a>
        </div>
    </div>

    <p style="margin-top:24px;font-size:14px;color:#555;">Enjoy your night out 🥳</p>
    <p style="font-size:14px;color:#888;">— The WKND Team</p>

    <hr style="border:none;border-top:1px solid #ddd;margin:40px 0 20px 0;" />

    <div style="text-align:center;font-size:12px;color:#888;">
        <p style="margin-bottom:16px;">
            <a href="https://www.instagram.com/wknd.app"
               style="display:inline-block;background:#f2f2f2;padding:8px 16px;border-radius:24px;
                  text-decoration:none;color:#333;font-weight:500;font-size:13px;">
                Follow us
            </a>
        </p>
        <p style="margin:6px 0;">
            <a href="https://www.wkndevent.com/" style="color:#555;text-decoration:none;">www.wkndevent.com</a>
        </p>
        <p style="margin:8px 0 0 0;color:#999;">© 2025 WKND</p>
    </div>
</div>
</body>
</html>
