<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Verify Your Email</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:'Segoe UI',sans-serif;color:#1a1a1a;">
<!-- 👇 enable Thymeleaf text inlining so [[${...}]] is rendered server-side -->
<div th:inline="text" style="max-width:480px;margin:40px auto;background-color:#ffffff;border-radius:12px;padding:36px;box-shadow:0 4px 20px rgba(0,0,0,0.05);">

    <h2 style="font-weight:600;margin-bottom:12px;">Welcome, [[${name}]] 👋</h2>

    <p style="font-size:15px;line-height:1.6;">
        Thanks for signing up to WKND. Use the code below to verify your email address:
    </p>

    <div style="margin:28px 0;text-align:center;">
      <span style="display:inline-block;background-color:#e0e0e0;color:#000000;font-size:22px;font-weight:600;padding:14px 28px;border-radius:8px;letter-spacing:2px;">
        [[${code}]]
      </span>
    </div>

    <p style="font-size:13px;color:#555;">This code is valid for 10 minutes. If you didn’t request this, feel free to ignore it.</p>
    <p style="margin-top:36px;font-size:14px;color:#888;">— WKND Team</p>

    <hr style="border:none;border-top:1px solid #ddd;margin:40px 0 20px 0;" />

    <div style="text-align:center;font-size:12px;color:#888;">
        <p style="margin-bottom:16px;">
            <a href="https://www.instagram.com/wkndevent/?hl=es"
               style="display:inline-block;background-color:#f2f2f2;padding:8px 16px;border-radius:24px;text-decoration:none;color:#333;font-weight:500;font-size:13px;">
                Follow us on Instagram
            </a>
        </p>
        <p style="margin:6px 0;">
            <a href="https://www.wkndevent.com/" style="color:#555;text-decoration:none;">www.wkndevent.com</a>
        </p>
        <p style="margin:8px 0 0 0;color:#999;">© 2025 WKND</p>
    </div>
</div>
</body>
</html>
