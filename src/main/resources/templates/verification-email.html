<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Verify Your Email</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: 'Segoe UI', sans-serif; color: #1a1a1a;">
<div style="max-width: 480px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; padding: 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">

    <h2 style="font-weight: 600; margin-bottom: 12px;">Welcome, [[${name}]] 👋</h2>

    <p style="font-size: 15px; line-height: 1.6;">
        Thanks for signing up to WKND. Use the code below to verify your email address:
    </p>

    <div style="margin: 28px 0; text-align: center;">
      <span style="display: inline-block; background-color: #e0e0e0; color: #000; font-size: 22px; font-weight: 600; padding: 14px 28px; border-radius: 8px; letter-spacing: 2px;">
        [[${code}]]
      </span>
    </div>

    <p style="font-size: 13px; color: #555;">
        This code is valid for 10 minutes. If you didn’t request this, feel free to ignore it.
    </p>

    <p style="margin-top: 36px; font-size: 14px; color: #888;">
        — WKND Team
    </p>
</div>
</body>
</html>
